<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Datum">
  <!--
    The same survey monument the top bar carries: an outer ring, a filled
    center, and the four cardinal ticks that orient it on the ground. Drawn on
    its own dark ground rather than transparent, so it holds together against
    both a light and a dark browser tab.
  -->
  <rect width="32" height="32" rx="7" fill="#0E1114"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#99A5B0" stroke-width="2"/>
  <circle cx="16" cy="16" r="4" fill="#4C8DFF"/>
  <g stroke="#7C8794" stroke-width="2" stroke-linecap="square">
    <line x1="16" y1="2.5" x2="16" y2="6"/>
    <line x1="16" y1="26" x2="16" y2="29.5"/>
    <line x1="2.5" y1="16" x2="6" y2="16"/>
    <line x1="26" y1="16" x2="29.5" y2="16"/>
  </g>
</svg>
