name: "Update or report a server"
description: Fix a wrong entry, report a dead link, or add details to an existing record
title: "[update] <org or server id>"
labels: ["request:update", "triage"]
body:
  - type: input
    id: id
    attributes:
      label: Record id or URL
      description: The `org_id`, `server_id`, or the server URL as currently listed
    validations: { required: true }
  - type: dropdown
    id: action
    attributes:
      label: What needs to change?
      # These strings are also the option values in the form at
      # datum-gis.com/contribute/change/. GitHub matches a prefill on the label,
      # so a change here has to be made in both places or the dropdown arrives
      # with nothing selected.
      options:
        - Stopped responding
        - The URL changed
        - Attributed to the wrong organization
        - The level or state is wrong
        - It needs a login now
        - Something else
    validations: { required: true }
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: New URL, corrected name, contact page, etc.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link to the agency page, error message you see, etc.
