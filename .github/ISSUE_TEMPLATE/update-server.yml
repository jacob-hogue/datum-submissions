name: "Update or report a server"
description: Fix a wrong entry, report a dead link, or add details to an existing record
title: "[update] <org or server id>"
labels: ["request:update", "triage"]
body:
  - type: input
    id: id
    attributes:
      label: Record id or URL
      description: The `org_id`, `server_id`, or the server URL as currently listed
    validations: { required: true }
  - type: dropdown
    id: action
    attributes:
      label: What needs to change?
      options:
        - Server is dead / moved (report_dead)
        - URL is wrong or has a new address (update_server)
        - Wrong jurisdiction, level, or state (update_org)
        - Add or fix website / contact details (update_org)
        - Remove — not a public government server (remove_server)
        - Other
    validations: { required: true }
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: New URL, corrected name, contact page, etc.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link to the agency page, error message you see, etc.
